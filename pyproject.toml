[project]
name = "kalshi-bot"
version = "0.2.0"
description = "Event-driven Kalshi soccer under-No trading bot"
requires-python = ">=3.11"
dependencies = [
  "websockets>=12.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0",
  "cryptography>=41.0",
  "fastapi>=0.104.0",
  "uvicorn>=0.24.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[project.scripts]
kalshi-bot = "kalshi_bot.cli:cli"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kalshi_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
