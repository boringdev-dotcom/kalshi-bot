[project]
name = "courtside"
version = "0.1.0"
description = "Courtside: a Kalshi trading desk with a learning agent for live NBA totals"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "cryptography>=42",
  "anthropic>=1.0",
]

[project.scripts]
courtside = "courtside.main:run"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["courtside"]

[tool.pytest.ini_options]
testpaths = ["tests"]
