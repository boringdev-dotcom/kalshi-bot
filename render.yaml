# Kalshi soccer bot — worker + API + static dashboard.
# SQLite is local to each service. For a single journal, run
# `kalshi-bot run-all` on the web service (or attach one disk and
# do not split API/worker until you move off SQLite).

previewsEnabled: false

envVarGroups:
  - name: kalshi-soccer-secrets
    envVars:
      - key: KALSHI_API_KEY_ID
        sync: false
      - key: KALSHI_PRIVATE_KEY_PEM
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: KALSHI_ENV
        value: demo
      - key: PAPER_MODE
        value: "true"
      - key: XAI_MODEL
        value: grok-4-1-fast
      - key: SQLITE_PATH
        value: /var/data/kalshi_bot.sqlite

services:
  - type: worker
    name: kalshi-soccer-worker
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install .
    startCommand: kalshi-bot run-worker
    maxShutdownDelaySeconds: 60
    envVars:
      - fromGroup: kalshi-soccer-secrets

  - type: web
    name: kalshi-soccer-api
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install .
    startCommand: kalshi-bot run-api
    healthCheckPath: /health
    envVars:
      - fromGroup: kalshi-soccer-secrets
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: kalshi-soccer-ui
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: SKIP_INSTALL_DEPS
        value: "true"
